<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{--brand:#1466d6;--primary:#2b7fff;--bg:#ffffff;--surface:#f7f8fa;--border:#e5e7eb;--fg:#16181d;--fg-muted:#61697a;
--font-sans:'Pretendard','Inter',system-ui,sans-serif;--font-latin:'Inter',system-ui,sans-serif;--font-mono:ui-monospace,Menlo,monospace;
--radius-sm:8px;--radius:12px;--radius-lg:16px;--leading-body:1.75;--leading-tight:1.35;--tracking-title:-0.025em;--tracking-body:-0.003em}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:16px;line-height:var(--leading-body);letter-spacing:var(--tracking-body);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
:lang(en){font-family:var(--font-latin);letter-spacing:0;word-break:normal}
h1,h2,h3{line-height:var(--leading-tight);letter-spacing:var(--tracking-title);margin:0 0 8px}
/* <image-slot> shim — filled slots show a real (self-hosted R2) photo; any unfilled
   ones fall back to a neutral labeled placeholder. */
image-slot{display:block;position:relative;width:100%;height:100%;min-height:120px;background:linear-gradient(135deg,#e2e8f2,#eef1f6)}
image-slot::after{content:attr(placeholder);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa7bd;font-size:13px;font-weight:600;letter-spacing:0}
image-slot[data-filled]{background-size:cover;background-position:center;background-repeat:no-repeat}
image-slot[data-filled]::after{content:none}
image-slot[shape="circle"],image-slot[shape="pill"]{border-radius:999px}
</style></head>
<body>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;border-bottom:1px solid var(--border)"><b style="font-size:17px">한걸음교회</b><span style="font-size:20px">✕</span></div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:2px;font-size:18px">
      <div style="padding:16px 0;border-bottom:1px solid var(--border);font-weight:600">교회 소개</div>
      <div style="padding:16px 0;border-bottom:1px solid var(--border)">예배 안내</div>
      <div style="padding:16px 0;border-bottom:1px solid var(--border)">설교 말씀</div>
      <div style="padding:16px 0;border-bottom:1px solid var(--border)">소식 · 주보</div>
      <div style="padding:16px 0;border-bottom:1px solid var(--border)">오시는 길</div>
      <div style="padding:16px 0;border-bottom:1px solid var(--border)">기도 요청 · 심방</div>
      <div style="padding:16px 0;border-bottom:1px solid var(--border)">온라인 헌금</div>
    </div>
    <div style="padding:0 20px 24px"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);padding:16px 18px"><span style="font-size:15px;color:var(--fg-muted)">글자 크게 보기</span><div style="display:flex;gap:8px"><span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:34px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font-size:14px;font-weight:600">가</span><span style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:34px;border-radius:var(--radius-sm);background:var(--fg);color:#fff;font-size:18px;font-weight:600">가</span></div></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px"><span style="display:inline-flex;align-items:center;justify-content:center;height:50px;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:15px;font-weight:600">주일예배 생중계</span><span style="display:inline-flex;align-items:center;justify-content:center;height:50px;border-radius:var(--radius);border:1px solid var(--border);font-size:15px;font-weight:600">카카오톡 채널 추가</span></div></div>
  </body></html>
